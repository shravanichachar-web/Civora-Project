<style>

}

  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}

.paper{background:#fff;color:#1a2942;border:1px solid #d9e1eb;border-radius:6px;padding:24px 18px;text-align:center;box-shadow:var(--shadow)}

.seg{max-width:100%}
.seg.wrap{display:flex;flex-wrap:wrap;overflow:visible;border:0;gap:6px}

.seg.wrap button[aria-pressed="true"]{border-color:var(--accent)}

  '<div class="row between"><h2>Complaints</h2><select class="inline" id="fstat" aria-label="Filter status">'+['All','Submitted','Assigned','In Progress','Resolved','Rejected'].map(function(s){return '<option'+(s===f?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div>'+
  '<div class="tablewrap"><table><thead><tr><th>ID</th><th>Issue</th><th>Area</th><th>Priority</th><th>Status</th><th>Assigned</th><th>Action</th></tr></thead><tbody>'+list.map(function(x){
    var opts=S.emps.filter(function(e){return e.dept===x.dept&&e.status!=='On Leave'});
    return '<tr><td class="mono">'+x.id+'</td><td><b>'+esc(x.cat)+'</b><div class="muted">'+esc(x.desc.slice(0,70))+'</div></td><td>'+esc(x.area)+'</td><td>'+pill(x.pri)+'</td><td>'+pill(x.status)+'</td><td class="mono">'+(x.emp||'—')+'</td><td>'+
    (x.status==='Submitted'?'<div class="row" style="flex-wrap:nowrap"><select class="inline" id="as-'+x.id+'" aria-label="Assign">'+(opts.length?opts.map(function(e){return '<option value="'+e.id+'">'+esc(e.name)+'</option>'}).join(''):'<option value="">No staff free</option>')+'</select><button class="btn sm primary" data-act="assign" data-id="'+x.id+'">Assign</button><button class="btn sm danger" data-act="reject" data-id="'+x.id+'">Reject</button></div>':'<button class="btn sm" data-act="viewc" data-id="'+x.id+'">Open</button>')+'</td></tr>'}).join('')+'</tbody></table></div>'+
  '<h2>Employees</h2><div class="tablewrap"><table><thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Area</th><th>Status</th><th>Rating</th><th>Done</th></tr></thead><tbody>'+S.emps.map(function(e){return '<tr><td class="mono">'+e.id+'</td><td>'+esc(e.name)+'<div class="muted">'+esc(e.role)+'</div></td><td>'+esc(e.dept)+'</td><td>'+esc(e.area)+'</td><td>'+pill(e.status)+'</td><td>'+e.rating+'</td><td>'+e.done+'</td></tr>'}).join('')+'</tbody></table></div>';
};
/* ---- employee ---- */
V.tasks=function(){
  var id=S.user.id;var mineT=S.comps.filter(function(c){return c.emp===id});
  var active=mineT.filter(function(c){return c.status==='Assigned'||c.status==='In Progress'});
  return '<h1>My field tasks</h1><div class="grid g3"><div class="card kpi"><b>'+active.length+'</b><span>Active</span></div><div class="card kpi"><b>'+mineT.filter(function(c){return c.status==='Resolved'}).length+'</b><span>Completed</span></div><div class="card kpi"><b>'+esc(S.user.area)+'</b><span>Assigned area</span></div></div>'+
  (mineT.length?'<div class="stack">'+mineT.map(function(c){
    var act='';if(c.status==='Assigned'&&c.stage!=='Work Accepted')act='<button class="btn primary sm" data-act="accept" data-id="'+c.id+'">Accept task</button>';
    else if(c.status==='Assigned')act='<button class="btn primary sm" data-act="start" data-id="'+c.id+'">Start work</button>';
    else if(c.status==='In Progress')act='<form class="row" data-form="complete" data-id="'+c.id+'" style="flex-wrap:nowrap"><input id="rm-'+c.id+'" placeholder="Completion remark" required><button class="btn primary sm">Mark resolved</button></form>';
    return '<div class="card stack"><div class="row between"><div><h3>'+esc(c.cat)+'</h3><div class="mono muted">'+c.id+' · '+esc(c.loc)+'</div></div><div class="row">'+pill(c.pri)+pill(c.status)+'</div></div><p>'+esc(c.desc)+'</p><div class="row">'+act+'<button class="btn sm" data-act="viewc" data-id="'+c.id+'">Timeline</button></div></div>'}).join('')+'</div>':'<div class="card"><p>No tasks assigned to you right now.</p></div>');
};

/* ---------- render ---------- */
var PUB={home:1,map:1,help:1,login:1};
function render(){
  var r=role(),v=S.view;
  if(!r&&!PUB[v])v='login';
  if(r==='admin'&&['admin','map','profile'].indexOf(v)<0)v='admin';
  if(r==='employee'&&['tasks','map','profile'].indexOf(v)<0)v='tasks';
  if(r==='citizen'&&(v==='admin'||v==='tasks'||v==='login'))v='home';
  S.view=v;
  var scrollY=window.scrollY;
  stopMap();
  $('#app').innerHTML=shell(V[v]());
  syncModal();
  if(v==='map')startMap();
  if(v==='profile'){var l=$('#lang2');if(l)l.value=S.lang}
  document.title='Civora';
  save();
}
function go(v){S.view=v;render();window.scrollTo(0,0)}
function syncModal(){var old=$('.modal-bg');if(old)old.remove();if(S.modal){var d=document.createElement('div');d.innerHTML=modalHtml();document.body.appendChild(d.firstChild)}}
function setModal(h){S.modal=h;syncModal()}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el){return}
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(a==='closeBg'){if(e.target===el){setModal(null)}return}
  var c=id&&S.comps.filter(function(x){return x.id===id})[0];
  switch(a){
   case 'go':go(el.getAttribute('data-v'));break;
   case 'needlogin':toast('Sign in as a citizen to report an issue');go('login');break;
   case 'lmode':S.loginMode=el.getAttribute('data-v');render();break;
   case 'ltab':S.loginTab=el.getAttribute('data-v');render();break;
   case 'theme':S.theme=S.theme==='auto'?'dark':S.theme==='dark'?'light':'auto';applyTheme();render();break;
   case 'logout':S.user=null;S.loginMode='in';S.view='home';render();break;
   case 'close':setModal(null);break;
   case 'viewc':setModal(complaintModal(id));break;
   case 'viewcert':{var ce=S.certs.filter(function(x){return x.id===id})[0];setModal('<div class="row between"><h3>'+esc(ce.type)+'</h3><button class="btn sm" data-act="close">Close</button></div>'+(ce.kind?certPaper(ce):'<div class="card stack"><p class="muted">Kolhapur Municipal Corporation</p><p>This certifies that <b>'+esc(ce.name)+'</b> has been issued a <b>'+esc(ce.type)+'</b>.</p><p class="mono">Reference '+esc(ce.ref)+' · Issued '+fmtD(ce.date)+'</p><p class="muted">Sample document for demonstration only.</p></div>'));break}
   case 'copycert':{var cc=S.certs.filter(function(x){return x.id===id})[0];var sm='Civora '+cc.kind+' certificate (model); name: '+cc.name+'; date: '+cc.evDate+'; place: '+cc.place+'; MODEL - NOT AN OFFICIAL DOCUMENT.';
     if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(sm).then(function(){toast('Summary copied')},function(){toast('Copy is blocked here. Select the text on the certificate instead.')})}else toast('Copy is blocked here. Select the text on the certificate instead.');break}
   case 'certreset':setTimeout(function(){S.lastCert='';var pv=$('#certprev');if(pv)pv.innerHTML=certPreview();syncCertType()},0);break;
   case 'rate':{var h='<div class="row between"><h3>Rate this fix</h3><button class="btn sm" data-act="close">Close</button></div><div class="stars" id="stars" data-id="'+id+'">'+[1,2,3,4,5].map(function(n){return '<button data-act="star" data-n="'+n+'" data-id="'+id+'" aria-label="'+n+' stars">★</button>'}).join('')+'</div><p class="muted">Tap a star to submit your rating.</p>';setModal(h);break}
   case 'star':c.rating=+el.getAttribute('data-n');c.log.unshift({t:'Citizen rated '+c.rating+'/5',d:'Feedback received',at:new Date().toISOString(),who:'Citizen'});setModal(null);toast('Thanks for rating');render();break;
   case 'assign':{var sel=$('#as-'+id);if(!sel||!sel.value){toast('No free staff in this department');break}
     var emp=S.emps.filter(function(x){return x.id===sel.value})[0];c.emp=emp.id;c.status='Assigned';c.stage='Assigned';c.updated=new Date().toISOString();emp.status=emp.status==='Active'?'On Field':emp.status;
     c.log.push({t:'Assigned to '+emp.name,d:emp.id+' · '+c.dept,at:c.updated,who:'Admin'});notify('announcement','Complaint '+c.id+' assigned',emp.name+' will handle your '+c.cat.toLowerCase()+' complaint.',c.area,'Info');toast('Assigned to '+emp.name);render();break}
   case 'reject':c.status='Rejected';c.updated=new Date().toISOString();c.log.push({t:'Rejected',d:'Rejected after review by admin',at:c.updated,who:'Admin'});notify('system','Complaint '+c.id+' rejected','Your complaint was closed after review.',c.area);toast('Complaint rejected');render();break;
   case 'accept':c.stage='Work Accepted';c.updated=new Date().toISOString();c.log.push({t:'Work accepted',d:'Field officer accepted the task',at:c.updated,who:'Field team'});render();break;
   case 'start':c.status='In Progress';c.stage='In Progress';c.updated=new Date().toISOString();c.log.push({t:'Work started',d:'Crew is on site',at:c.updated,who:'Field team'});notify('maintenance','Work started on '+c.id,'A crew is now working on your '+c.cat.toLowerCase()+' complaint.',c.area,'Info');render();break;
   case 'ask':sendChat(el.getAttribute('data-q'));break;
   case 'clearchat':S.chat=[];$('#chatlog').innerHTML=chatMsg({me:false,t:'Chat cleared. What would you like to know?'});save();break;
   case 'faqcat':faqCat=el.getAttribute('data-v');[].forEach.call(document.querySelectorAll('[data-act=faqcat]'),function(b2){b2.setAttribute('aria-pressed',String(b2.getAttribute('data-v')===faqCat))});$('#faqlist').innerHTML=faqHtml();break;
   case 'copynum':{var nm=el.getAttribute('data-v');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(nm).then(function(){toast('Copied '+nm)},function(){toast('Number: '+nm)})}else toast('Number: '+nm);break}
   case 'delticket':S.tickets=(S.tickets||[]).filter(function(x){return x.id!==id});$('#ticketlist').innerHTML=ticketList();toast('Request withdrawn');save();break;
   case 'focusticket':{var tm=$('#tm');if(tm){tm.scrollIntoView({behavior:'smooth',block:'center'});tm.focus()}break}
   case 'reset':try{localStorage.removeItem(STORE)}catch(x){}S=seed();applyTheme();render();toast('Demo data reset');break;
  }
});
document.addEventListener('change',function(e){
  var t2=e.target;
  if(t2.id==='lang'||t2.id==='lang2'){S.lang=t2.value;render()}
  if(t2.id==='cf-type'){syncCertType()}
  if(t2.id==='fstat'){S.fstat=t2.value;render()}
  if(t2.id==='cp'){var f=t2.files&&t2.files[0];var im=$('#cprev');if(f&&im){var rd=new FileReader();rd.onload=function(){im.src=rd.result;im.hidden=false;S._photo=rd.result};rd.readAsDataURL(f)}}
});
document.addEventListener('input',function(e){
  if(e.target.id==='fq'){$('#faqlist').innerHTML=faqHtml()}
  if(e.target.id==='cd'){var b=$('#detectbox');if(b)b.innerHTML=detectHtml(detect(e.target.value))}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();var k=f.getAttribute('data-form'),id=f.getAttribute('data-id');
  var v=function(i){return ($('#'+i)||{}).value};
  var lerr=function(m){var el=$('#lerr');if(el){el.textContent=m;el.hidden=false}else toast(m)};
  if(k==='login-citizen'){var mob=v('lm').trim(),acc=S.accounts.filter(function(x){return x.mobile===mob})[0];
    if(!acc){lerr('No account found for this mobile number. Create an account first.')}
    else if(sha256(acc.salt+':'+v('lp'))!==acc.hash){lerr('Wrong password. Try again.')}
    else{S.user={role:'citizen',name:acc.name,mobile:acc.mobile,area:acc.area,id:acc.mobile};S.view='dashboard';render();toast('Welcome back, '+acc.name.split(' ')[0])}}
  else if(k==='signup'){var nm=v('sn').trim(),mb=v('sm').trim(),pw=v('sp');
    if(!/^[0-9]{10}$/.test(mb)){lerr('Enter a 10-digit mobile number.')}
    else if(pw.length<6){lerr('Password must be at least 6 characters.')}
    else if(pw!==v('sp2')){lerr('The two passwords do not match.')}
    else if(S.accounts.some(function(x){return x.mobile===mb})){lerr('An account with this mobile number already exists. Sign in instead.')}
    else{var ac=mkAccount(nm,mb,pw);S.accounts.push(ac);S.user={role:'citizen',name:ac.name,mobile:ac.mobile,area:ac.area,id:ac.mobile};S.view='dashboard';render();toast('Account created. Welcome, '+nm.split(' ')[0])}}
  else if(k==='login-admin'){if(v('au')==='admin'&&v('ap')==='admin123'){S.user={role:'admin',name:'KMC Admin',id:'ADMIN',dept:'Administration'};S.view='admin';render()}else toast('Wrong username or password')}
  else if(k==='login-emp'){var em=S.emps.filter(function(x){return x.id===v('eu').trim().toUpperCase()})[0];if(em&&v('ep')==='emp123'){S.user={role:'employee',name:em.name,id:em.id,dept:em.dept,area:em.area};S.view='tasks';render()}else toast('Check the employee ID and password')}
  else if(k==='complaint'){
    var d=detect(v('cd'))||{category:'General Civic Issue',department:'Health & Hygiene',priority:'Medium',eta:'3 days',confidence:70};
    var cid=nextCid(),now=new Date().toISOString();
    S.comps.unshift({id:cid,cat:d.category,desc:v('cd').trim(),loc:v('cs')+(v('cl').trim()?', '+v('cl').trim():''),street:v('cs'),area:v('ca'),status:'Submitted',pri:d.priority,dept:d.department,emp:'',stage:'',owner:'9876543210',submitted:now,updated:now,rating:0,remark:'',conf:d.confidence,photo:S._photo||'',log:[{t:'Complaint submitted',d:'Classified as '+d.category+' ('+d.confidence+'% confidence)',at:now,who:'Citizen'}]});
    S._photo='';notify('announcement','Complaint '+cid+' received','Routed to '+d.department+'. Estimated fix time '+d.eta+'.',v('ca'),'Info');
    S.modal='<h3>Complaint registered</h3><div class="kpi"><b class="mono">'+cid+'</b><span>Reference number</span></div><p>Category: <b>'+esc(d.category)+'</b><br>Department: '+esc(d.department)+'<br>Estimated fix: '+d.eta+'</p><button class="btn primary" data-act="close">Done</button>';S.view='track';render();
  }
  else if(k==='cert'){var kind=v('cf-type');var nn=S.certs.length+1;var c2={id:'CE'+(100+nn)+'-'+Math.floor(Math.random()*900+100),owner:S.user.mobile,kind:kind,type:kind+' Certificate',name:v('cf-name').trim(),evDate:v('cf-date').trim(),place:v('cf-place').trim(),p1:v('cf-p1').trim(),p2:v('cf-p2').trim(),rel:v('cf-rel').trim(),spouse:v('cf-spouse').trim(),wit:v('cf-wit').trim(),note:v('cf-note').trim(),ref:'CRT-'+(21000+nn),date:new Date().toISOString(),status:'Issued'};
    S.certs.unshift(c2);S.lastCert=c2.id;$('#certprev').innerHTML=certPreview();$('#certlist').innerHTML=certList();$('#certprev').scrollIntoView({behavior:'smooth',block:'start'});toast('Sample certificate generated');save()}
  else if(k==='complete'){var c=S.comps.filter(function(x){return x.id===id})[0];c.status='Resolved';c.stage='Completed';c.remark=v('rm-'+id);c.updated=new Date().toISOString();c.log.push({t:'Resolved',d:c.remark,at:c.updated,who:'Field team'});
    var em2=S.emps.filter(function(x){return x.id===c.emp})[0];if(em2){em2.done+=1}notify('maintenance','Complaint '+c.id+' resolved',c.remark,c.area,'Info');toast('Marked as resolved');render()}
  else if(k==='chat'){var q0=v('cq');$('#cq').value='';sendChat(q0)}
  else if(k==='ticket'){S.tickets=S.tickets||[];var tk={id:'HELP-'+(1001+S.tickets.length+Math.floor(Math.random()*9)),topic:v('tt'),msg:v('tm').trim(),name:v('tn').trim(),at:new Date().toISOString()};S.tickets.unshift(tk);$('#tm').value='';$('#ticketlist').innerHTML=ticketList();toast('Request sent. Reference '+tk.id);save()}
});
function applyTheme(){var r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme)}
applyTheme();
render();
})();
</script>
